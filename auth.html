<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reword - Authentication</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet"/>
  <style>
    :root {
      --bg-color: #f9faf6;
      --primary-color: #1b4332;
      --primary-hover: #122e22;
      --text-white: #ffffff;
      --text-dark: #1b1c1a;
      --text-muted: #414844;
      --border-color: #c1c8c2;
      --focus-ring: #1b4332;
      --card-bg: #ffffff;
      --card-low-bg: #f5f3f0;
      --border-radius-card: 12px;
      --border-radius-btn: 8px;
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
      --shadow-md: 0 4px 12px rgba(45,45,45,0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      font-family: 'Inter', sans-serif;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    h1, h2 { font-family: 'Literata', serif; }
    
    .auth-container {
      width: 400px;
      background-color: var(--card-bg);
      border-radius: var(--border-radius-card);
      padding: 32px;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(193, 200, 194, 0.3);
    }
    
    .logo-section {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-section h1 {
      font-size: 28px;
      color: var(--primary-color);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .logo-section p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    
    .view { display: none; }
    .view.active { display: block; }

    .input-group { margin-bottom: 16px; }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-btn);
      padding: 12px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .input-group input:focus {
      outline: none;
      border-color: var(--focus-ring);
      box-shadow: 0 0 0 1px var(--focus-ring);
    }

    .btn-primary {
      width: 100%;
      background-color: var(--primary-color);
      color: var(--text-white);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 16px;
      border: none;
      border-radius: var(--border-radius-btn);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

    .btn-secondary {
      width: 100%;
      background-color: var(--card-bg);
      color: var(--text-dark);
      border: 1px solid var(--border-color);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 16px;
      border-radius: var(--border-radius-btn);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background-color: var(--card-low-bg); }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }
    .divider:not(:empty)::before { margin-right: .5em; }
    .divider:not(:empty)::after { margin-left: .5em; }

    .link {
      background: none;
      border: none;
      color: var(--primary-color);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: underline;
    }
    .link:hover { color: var(--primary-hover); }
    
    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }
    
    .bonus-text {
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .error-msg {
      color: #d32f2f;
      background-color: #fdecea;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }

    .forgot-pass-link {
      display: block;
      text-align: right;
      margin-top: -8px;
      margin-bottom: 16px;
    }
    
    /* Google Icon SVG */
    .google-icon {
      width: 18px;
      height: 18px;
    }
  </style>
  <script data-clerk-publishable-key="pk_test_c2Vuc2libGUtZ2xvd3dvcm0tNTYuY2xlcmsuYWNjb3VudHMuZGV2JA" src="clerk.browser.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="logo-section">
      <h1><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 28px;">auto_fix_high</span> Reword</h1>
      <p>Write like you. Not like AI.</p>
    </div>
    
    <div id="error-box" class="error-msg"></div>

    <!-- Sign In View -->
    <div id="view-signin" class="view active">
      <form id="form-signin">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="signin-email" required />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="signin-password" required />
        </div>
        <div class="forgot-pass-link">
          <button type="button" class="link" id="link-forgot-password">Forgot password?</button>
        </div>
        <button type="submit" id="btn-signin" class="btn-primary">Sign In</button>
      </form>
      
      <div class="divider">or</div>
      
      <button type="button" class="btn-secondary btn-google-login">
        <svg class="google-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
      
      <div class="footer-text">
        Don't have an account? <button type="button" class="link" id="link-go-signup">Sign up &rarr;</button>
      </div>
    </div>

    <!-- Sign Up View -->
    <div id="view-signup" class="view">
      <form id="form-signup">
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="signup-name" required />
        </div>
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="signup-email" required />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="signup-password" required />
        </div>
        <button type="submit" id="btn-signup" class="btn-primary">Create Account</button>
      </form>
      
      <div class="divider">or</div>
      
      <button type="button" class="btn-secondary btn-google-login">
        <svg class="google-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
      
      <div class="footer-text">
        Already have an account? <button type="button" class="link" id="link-go-signin">Sign in &rarr;</button>
      </div>
      <div class="bonus-text">
        3 free rewrites on signup. No credit card needed.
      </div>
    </div>
    
    <!-- Code Verification View -->
    <div id="view-verify" class="view">
      <form id="form-verify">
        <h2>Verify your email</h2>
        <p style="font-size:13px; color:var(--text-muted); margin: 8px 0 16px;">We sent a verification code to your email.</p>
        <div class="input-group">
          <label>Verification Code</label>
          <input type="text" id="verify-code" required />
        </div>
        <button type="submit" id="btn-verify" class="btn-primary">Verify & Continue</button>
      </form>
    </div>

    <!-- Forgot Password View -->
    <div id="view-forgot" class="view">
      <h2>Reset Password</h2>
      <form id="form-forgot" style="margin-top: 16px;">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="forgot-email" required />
        </div>
        <button type="submit" id="btn-forgot" class="btn-primary">Send Reset Link</button>
      </form>
      <div class="footer-text">
        <button type="button" class="link" id="link-back-to-signin">&larr; Back to sign in</button>
      </div>
    </div>
    
    <!-- Reset Password Code View -->
    <div id="view-reset" class="view">
      <h2>Create New Password</h2>
      <form id="form-reset" style="margin-top: 16px;">
        <div class="input-group">
          <label>Reset Code (from email)</label>
          <input type="text" id="reset-code" required />
        </div>
        <div class="input-group">
          <label>New Password</label>
          <input type="password" id="reset-password" required />
        </div>
        <button type="submit" id="btn-reset" class="btn-primary">Set New Password</button>
      </form>
    </div>

  </div>
  <script src="auth.js"></script>
</body>
</html>
