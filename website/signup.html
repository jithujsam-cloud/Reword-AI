<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Reword</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="logo" style="justify-content: center; margin-bottom: 16px;">
        <div class="logo-icon">R</div>
        Reword
      </div>
      <h2>Create your account</h2>
      <p class="subtitle">3 free rewrites. No credit card.</p>

      <div id="signup-error" class="error-msg hidden"></div>
      <div id="signup-success" class="hidden" style="background-color: var(--success-bg, #e6f6ec); color: var(--success-text, #1e7041); padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; text-align: center; border: 1px solid var(--success-text, #1e7041);"></div>
      
      <form id="form-signup">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Create a password" required>
        </div>
        <button type="submit" id="btn-signup" class="btn btn-primary">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="signin.html">Sign in &rarr;</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { supabase, showError, hideError, validateEmail, setBtnLoading } from './auth.js';

    document.getElementById('form-signup').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError('signup-error');

      const nameInput = document.getElementById('name');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const btnId = 'btn-signup';

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!name || !email || !password) {
        showError('signup-error', 'Please fill in all fields');
        return;
      }
      if (!validateEmail(email)) {
        showError('signup-error', 'Please enter a valid email');
        return;
      }
      if (password.length < 6) {
        showError('signup-error', 'Password must be at least 6 characters');
        return;
      }

      setBtnLoading(btnId, true, 'Create Account');

      try {
        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: { full_name: name },
            emailRedirectTo: 'https://clospect.online/dashboard.html'
          }
        });

        if (error) {
          const msg = error.message || 'An unexpected error occurred.';
          if (msg.toLowerCase().includes('already registered') || msg.toLowerCase().includes('already been registered')) {
            showError('signup-error', 'Email already registered. Please sign in instead.');
            return;
          }
          if (msg.toLowerCase().includes('rate limit') || msg.toLowerCase().includes('exceeded')) {
            showError('signup-error', 'Too many attempts. Wait a few minutes.');
            return;
          }
          showError('signup-error', msg);
          return;
        }

        if (data.user) {
          const { error: insertErr } = await supabase
            .from('users')
            .insert({
              supabase_user_id: data.user.id,
              email: data.user.email,
              plan: 'free',
              rewrites_used: 0,
              rewrites_limit: 3,
              payment_status: 'inactive'
            });

          if (insertErr) {
            console.error('DB insert failed:', insertErr.message);
          }

          if (data.session) {
            // Email confirmation is disabled — user is signed in immediately.
            const successEl = document.getElementById('signup-success');
            successEl.textContent = 'Account created successfully! Connecting to extension...';
            successEl.classList.remove('hidden');
            document.getElementById('form-signup').style.display = 'none';

            setTimeout(() => {
              window.close();
              // Fallback if browser blocks window.close()
              window.location.href = 'dashboard.html';
            }, 2000);
          } else {
            // Email confirmation is enabled — ask the user to check their inbox.
            const form = document.getElementById('form-signup');
            form.innerHTML = `
              <div style="text-align:center;padding:24px 0;">
                <div style="font-size:40px;margin-bottom:16px;">📬</div>
                <h3 style="margin-bottom:8px;">Check your email</h3>
                <p style="color:#666;font-size:14px;line-height:1.5;">
                  We sent a confirmation link to <strong>${data.user.email}</strong>.<br>
                  Click it to activate your account and sign in.
                </p>
              </div>
            `;
          }
        }

      } catch (err) {
        showError('signup-error', err.message || 'An unexpected error occurred.');
      } finally {
        setBtnLoading(btnId, false, 'Create Account');
      }
    });
  </script>
</body>
</html>
