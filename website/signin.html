<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Reword</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="logo" style="justify-content: center; margin-bottom: 16px;">
        <div class="logo-icon">R</div>
        Reword
      </div>
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to continue to Reword</p>

      <div id="signin-error" class="error-msg hidden"></div>
      <div id="signin-success" class="hidden" style="background-color: var(--success-bg, #e6f6ec); color: var(--success-text, #1e7041); padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; text-align: center; border: 1px solid var(--success-text, #1e7041);"></div>
      
      <form id="form-signin">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" id="btn-signin" class="btn btn-primary">Sign In</button>
      </form>

      <div class="auth-footer">
        <a href="#" style="display: block; margin-bottom: 16px;">Forgot password?</a>
        Don't have an account? <a href="signup.html">Sign up &rarr;</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { supabase, showError, hideError, validateEmail, setBtnLoading } from './auth.js';

    document.getElementById('form-signin').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError('signin-error');

      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const btnId = 'btn-signin';

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('signin-error', 'Please fill in all fields');
        return;
      }
      if (!validateEmail(email)) {
        showError('signin-error', 'Please enter a valid email');
        return;
      }

      setBtnLoading(btnId, true, 'Sign In');

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          const msg = error.message || 'An unexpected error occurred.';
          if (msg.toLowerCase().includes('invalid login')) {
            showError('signin-error', 'Incorrect email or password.');
            passwordInput.value = '';
            passwordInput.focus();
            return;
          }
          if (msg.toLowerCase().includes('rate limit') || msg.toLowerCase().includes('exceeded')) {
            showError('signin-error', 'Too many attempts. Wait a few minutes.');
            return;
          }
          showError('signin-error', msg);
          return;
        }

        const successEl = document.getElementById('signin-success');
        successEl.textContent = 'Logged in successfully! Connecting to extension...';
        successEl.classList.remove('hidden');
        document.getElementById('form-signin').style.display = 'none';

        // Notify extension immediately so it has time to grab the token.
        // We pass data.session directly to avoid any localStorage timing issues!
        window.postMessage({ type: 'REWORD_AUTH_SUCCESS', session: data.session }, '*');

        setTimeout(() => {
          window.close();
          // Fallback if browser blocks window.close()
          window.location.href = 'dashboard.html';
        }, 2000);

      } catch (err) {
        showError('signin-error', err.message || 'An unexpected error occurred.');
      } finally {
        setBtnLoading(btnId, false, 'Sign In');
      }
    });
  </script>
</body>
</html>
