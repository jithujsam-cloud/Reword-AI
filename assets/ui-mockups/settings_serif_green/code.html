<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Literata:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-container": "#19724f",
                    "on-error": "#ffffff",
                    "primary-fixed-dim": "#a5d0b9",
                    "on-background": "#1a1c1a",
                    "surface-dim": "#d9dad7",
                    "on-error-container": "#93000a",
                    "on-secondary": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-container": "#93ad98",
                    "outline": "#717973",
                    "on-tertiary-fixed-variant": "#354c3b",
                    "tertiary-fixed": "#cee9d3",
                    "secondary-fixed": "#a0f4c8",
                    "secondary-container": "#a0f4c8",
                    "tertiary-container": "#2a4131",
                    "on-primary-fixed-variant": "#274e3d",
                    "surface-container-low": "#f3f4f0",
                    "secondary": "#0e6c4a",
                    "on-primary-fixed": "#002114",
                    "primary": "#1b4332",
                    "error-container": "#ffdad6",
                    "surface-container": "#edeeea",
                    "tertiary": "#152b1c",
                    "surface-container-highest": "#e2e3df",
                    "on-secondary-fixed": "#002113",
                    "inverse-primary": "#a5d0b9",
                    "surface-container-high": "#e7e9e5",
                    "tertiary-fixed-dim": "#b3cdb7",
                    "on-surface": "#1a1c1a",
                    "surface-variant": "#e2e3df",
                    "surface-bright": "#f9faf6",
                    "outline-variant": "#c1c8c2",
                    "on-secondary-fixed-variant": "#005236",
                    "on-primary-container": "#86af99",
                    "on-primary": "#ffffff",
                    "background": "#f9faf6",
                    "inverse-surface": "#2e312f",
                    "error": "#ba1a1a",
                    "secondary-fixed-dim": "#85d7ad",
                    "surface": "#f9faf6",
                    "on-tertiary-fixed": "#092012",
                    "primary-container": "#1b4332",
                    "inverse-on-surface": "#f0f1ed",
                    "surface-container-lowest": "#ffffff",
                    "on-surface-variant": "#414844",
                    "primary-fixed": "#c1ecd4",
                    "surface-tint": "#3f6653"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "base": "8px",
                    "lg": "24px",
                    "md": "16px",
                    "max-width": "380px",
                    "sm": "8px",
                    "xs": "4px",
                    "xl": "32px"
            },
            "fontFamily": {
                    "label-md": ["Inter"],
                    "headline-md": ["Literata"],
                    "label-sm": ["Inter"],
                    "body-lg": ["Literata"],
                    "body-md": ["Literata"],
                    "headline-lg": ["Literata"]
            },
            "fontSize": {
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                    "headline-md": ["18px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #FDFCFB;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            font-family: 'Literata', serif;
        }
        .canvas {
            width: 100%;
            max-width: 380px;
            height: 100vh;
            position: relative;
            background-color: #f9faf6;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body>
<div class="canvas">
<!-- TopAppBar (Shared Component) -->
<header class="sticky top-0 z-50 bg-surface border-b border-secondary-container flex justify-between items-center w-full px-md py-sm mx-auto">
<div class="flex items-center gap-sm">
<button class="p-xs hover:bg-surface-container-low transition-colors rounded-full active:scale-95 transition-transform duration-150 text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tight">Settings</h1>
</div>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary" data-icon="settings">settings</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow px-md py-lg">
<div class="flex flex-direction-col gap-lg flex-col">
<!-- Branding/Icon Section -->
<div class="flex justify-center items-center py-md">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-on-primary text-4xl" style="font-variation-settings: 'FILL' 1;">auto_fix_high</span>
</div>
</div>
<!-- Settings Card -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(45,45,45,0.05)] border border-secondary-container/30">
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-xs" for="license-key">
<span class="material-symbols-outlined text-sm">key</span>
                        License Key
                    </label>
<div class="relative group">
<input class="w-full bg-surface-bright border border-secondary-container text-on-surface font-body-md text-body-md rounded-lg px-md py-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all placeholder:text-outline-variant" id="license-key" placeholder="XXXX-XXXX-XXXX-XXXX" type="text"/>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant/70 leading-relaxed font-['Inter']">
                        Unlock premium AI features and increase your monthly usage limit.
                    </p>
</div>
<div class="mt-lg">
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-sm rounded-lg shadow-sm hover:brightness-110 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-sm">
<span>Activate Pro</span>
<span class="material-symbols-outlined text-sm">bolt</span>
</button>
</div>
</div>
<!-- Secondary Info -->
<div class="mt-md space-y-sm">
<div class="flex items-center justify-between p-sm hover:bg-surface-container-low rounded-lg cursor-pointer transition-colors group">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">account_circle</span>
<span class="font-label-md text-label-md text-on-surface">Manage Account</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
</div>
</div>
</main>
<!-- Footer (Shared Component Inspired) -->
<footer class="fixed bottom-0 w-full flex justify-between items-center px-md py-xs max-w-[380px] bg-surface-container-low border-t border-secondary-container">
<div class="flex items-center gap-xs">
<span class="font-label-sm text-label-sm text-secondary">Reword</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">v1.2.4 • Status: Ready</span>
</div>
<div class="flex gap-md items-center">
<a class="font-label-sm text-label-sm text-primary font-semibold hover:text-primary transition-colors flex items-center gap-xs" href="#">
<span class="material-symbols-outlined text-[14px]">help</span>
                FAQ
            </a>
<span class="font-label-sm text-label-sm text-on-surface-variant">Usage: 14/50</span>
</div>
</footer>
</div>
<script>
    // Simple micro-interaction for the button
    const button = document.querySelector('button.bg-primary');
    button.addEventListener('mousedown', () => {
        button.classList.add('scale-95');
    });
    button.addEventListener('mouseup', () => {
        button.classList.remove('scale-95');
    });
    button.addEventListener('mouseleave', () => {
        button.classList.remove('scale-95');
    });

    // Simple feedback for input
    const input = document.getElementById('license-key');
    input.addEventListener('input', (e) => {
        if (e.target.value.length > 0) {
            input.classList.add('border-primary');
        } else {
            input.classList.remove('border-primary');
        }
    });
</script>
</body></html>
